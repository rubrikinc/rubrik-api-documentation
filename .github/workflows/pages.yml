name: Deploy Documentation

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1: The Build (Runs on your high-RAM Internal Runner)
  build:
    runs-on: self-hosted  # <--- This bypasses GitHub's 7GB/16GB limit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path to the folder containing your index.html
          path: '.' 

  # JOB 2: The Deployment (Runs on GitHub-hosted, uses zero RAM)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
